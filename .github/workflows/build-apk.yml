name: Compiler NOVA APK (Android 16)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du code source
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Acceptation des licences Android SDK 36
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Configuration de Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilation de l'APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Mise a disposition de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Android16-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
